name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore WaterOperations.slnx
      - run: dotnet build WaterOperations.slnx --configuration Release --no-restore
      - run: dotnet test WaterOperations.slnx --configuration Release --no-build
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements.txt pytest
        working-directory: ai-service
      - run: pytest
        working-directory: ai-service
  data-engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install -e ".[test]"
        working-directory: data-engineering
      - run: pytest
        working-directory: data-engineering

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "water-operations-data-engineering"
version = "0.1.0"
description = "Data engineering foundation for the Water Operations Intelligence Platform"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3", "pydantic-settings>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

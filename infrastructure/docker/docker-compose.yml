services:
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: ${ConnectionStrings__Default:?Set ConnectionStrings__Default in .env}
      ConnectionStrings__Redis: redis:6379
      Authentication__SigningKey: ${Authentication__SigningKey:?Set Authentication__SigningKey in .env}
      Authentication__Issuer: ${Authentication__Issuer:-water-operations}
      Authentication__Audience: ${Authentication__Audience:-water-operations-web}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      Cors__AllowedOrigins__1: http://127.0.0.1:5173
      AiModelClient__BaseUrl: http://ai-service:8000
      AiModelClient__ApiKey: ${AI_SERVICE_API_KEY:?Set AI_SERVICE_API_KEY in .env}
      Dahiti__Enabled: ${DAHITI_ENABLED:-false}
      Dahiti__ApiKey: ${DAHITI_API_KEY:-}
      Dahiti__Country: ${DAHITI_COUNTRY:-eg}
      Dahiti__StationIdsCsv: ${DAHITI_STATION_IDS:-}
      Dahiti__SyncIntervalMinutes: ${DAHITI_SYNC_INTERVAL_MINUTES:-360}
      Dahiti__RequestDelayMilliseconds: ${DAHITI_REQUEST_DELAY_MS:-250}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:4173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4173/"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-water_operations_intelligence_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes: [water-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build: ../../ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?Set AI_SERVICE_API_KEY in .env}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  water-postgres:
